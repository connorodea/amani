name: Amani
options:
  bundleIdPrefix: com.connorodea
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Amani:
    type: application
    platform: macOS
    sources:
      - path: Sources/Amani
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Amani
        CFBundleName: Amani
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: Resources/Amani.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorodea.Amani
        PRODUCT_NAME: Amani
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Connor O'Dea"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - AmaniTests
      gatherCoverageData: true
  AmaniTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AmaniTests
    dependencies:
      - target: Amani
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorodea.AmaniTests
        GENERATE_INFOPLIST_FILE: YES
